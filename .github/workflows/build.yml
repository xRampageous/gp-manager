name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Linux virtual display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          command -v Xvfb
          command -v xvfb-run
      - name: Validate on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" ./gradlew clean releaseCheck --console=plain
      - name: Validate on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat clean releaseCheck --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/simulation/
            build/libs/*.jar
