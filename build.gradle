tasks.register('simulationIsolationCheck') {
    group = 'verification'
    description = 'Verifies developer simulation classes are absent from normal plugin output.'
    dependsOn 'classes', 'simulationClasses'
    doLast {
        def leakedClasses = compiledClassPaths(sourceSets.main).intersect(compiledClassPaths(sourceSets.simulation))
        if (!leakedClasses.isEmpty()) {
            throw new GradleException('Simulation classes leaked into normal plugin output: ' + leakedClasses)
        }
        println 'Simulation isolation passed: developer harness is absent from normal plugin output.'
    }
}


tasks.register('simulationCheck') {
    group = 'verification'
    description = 'Runs both offline simulation suites and fails on any accounting regression.'
    dependsOn 'generalSimulation', 'pkSimulation', 'simulationIsolationCheck'
    doLast {
        println 'Offline simulation checks passed: general accounting and PK ledger.'
        println "Reports: ${layout.buildDirectory.dir('simulation').get().asFile}"
    }
}



tasks.register('configurationStabilityAudit') {
    group = 'verification'
    description = 'Checks current setting groups and raw-key migration continuity.'
    doLast {
        def configSource = file('src/main/java/com/gpmanager/GpManagerConfig.java').getText('UTF-8')
        [
            'name = "Tracking"',
            'name = "Accounting"',
            'name = "Loot display"',
            'name = "HUD+"',
            'name = "History"'
        ].each { marker ->
            if (!configSource.contains(marker)) {
                throw new GradleException("config compatibility audit failed: missing current section ${marker}")
            }
        }
        if (!configSource.contains('@ConfigGroup(GpManagerConfig.GROUP)')
            || !configSource.contains('String GROUP = "gpmanager"')) {
            throw new GradleException('config compatibility audit failed: canonical gpmanager group is missing.')
        }
        [
            'keyName = "autoResumeOnActivity"',
            'keyName = "defaultSessionName"',
            'keyName = "defaultSessionMode"',
            'keyName = "useHighAlchemyFallback"',
            'keyName = "useCurrencyProxies"',
            'keyName = "applyGeSellTax"',
            'keyName = "geBookingObserved"',
            'keyName = "geSellSpentIsNet"'
        ].each { marker ->
            if (configSource.contains(marker)) {
                throw new GradleException("config audit failed: retired pre-release setting remains: ${marker}")
            }
        }

        if (file('src/main/java/com/gpmanager/GpManagerConfigMigration.java').exists()) {
            throw new GradleException('config audit failed: the profitmanager bridge lives on GpManagerConfig; no separate migration class ships in 1.0.')
        }
        [
            'keyName = "trackingDisplay"',
            'keyName = "infoBoxView"',
            'keyName = "showLiveGpDrops"',
            'keyName = "gpDropPresentationPreset"',
            'keyName = "feedbackStyle"',
            'keyName = "enableDebugTrace"',
            'keyName = "accountingItemFilter"',
            'keyName = "ignoreUnpricedItems"',
            'keyName = "minimumTransactionValue"',
            'keyName = "ignoredItemIds"',
            'keyName = "correlationTicks"',
            'keyName = "lootCorrelationSeconds"',
            'keyName = "chargeLoadReviewMinutes"',
            'keyName = "pkSupplyWindowSeconds"',
            'keyName = "activityResetSeconds"'
        ].each { marker ->
            if (configSource.contains(marker)) {
                throw new GradleException("config audit failed: deleted visible setting remains: ${marker}")
            }
        }
        def savedStateSource = file('src/main/java/com/gpmanager/persistence/SavedState.java').getText('UTF-8')
        if (!savedStateSource.contains('CURRENT_SCHEMA_VERSION = 108')
            || !savedStateSource.contains('return schemaVersion == CURRENT_SCHEMA_VERSION;')) {
            throw new GradleException('data schema audit failed: the 1.0 SavedState schema 108 (reading only 108) is missing.')
        }

        println 'Configuration stability audit passed: current groups, retired pre-release keys, and the data schema.'
    }
}



tasks.register('brandingCompatibilityAudit') {
    group = 'verification'
    description = 'Checks the GP Manager public identity and stable compatibility identifiers.'
    doLast {
        def metadata = new Properties()
        file('runelite-plugin.properties').withInputStream { metadata.load(it) }
        def pluginSource = file('src/main/java/com/gpmanager/GpManagerPlugin.java').getText('UTF-8')
        def configSource = file('src/main/java/com/gpmanager/GpManagerConfig.java').getText('UTF-8')
        def repositorySource = file('src/main/java/com/gpmanager/persistence/SessionRepository.java').getText('UTF-8')
        def savedStateSource = file('src/main/java/com/gpmanager/persistence/SavedState.java').getText('UTF-8')
        def pluginFile = file('src/main/java/com/gpmanager/GpManagerPlugin.java').canonicalFile

        def descriptor = (pluginSource =~ /(?s)@PluginDescriptor\((.*?)\)\s*public class GpManagerPlugin/)
        if (!descriptor.find()) {
            throw new GradleException('GP Manager compatibility check failed: @PluginDescriptor is missing.')
        }
        def descriptorBody = descriptor.group(1)
        if (metadata.getProperty('displayName') != 'GP Manager'
            || metadata.getProperty('plugins') != 'com.gpmanager.GpManagerPlugin'
            || !descriptorBody.contains('name = "GP Manager"')
            || !descriptorBody.contains('internalName = "gp-manager"')
            || !descriptorBody.contains('legacyDataDirectory = "profit-manager"')) {
            throw new GradleException('GP Manager identity check failed: public metadata or descriptor identity is not stable.')
        }

        if (!configSource.contains('@ConfigGroup(GpManagerConfig.GROUP)')
            || !configSource.contains('String GROUP = "gpmanager"')
            || !pluginSource.contains('migrateGroup')
            || !pluginSource.contains('"profitmanager."')) {
            throw new GradleException('GP Manager compatibility check failed: canonical config group handling is missing.')
        }

        int rootCall = pluginSource.indexOf('repository.initialize(getPluginDirectory())')
        int persistenceStartCall = pluginSource.indexOf('persistence.start()')
        if (!pluginSource.contains('public class GpManagerPlugin')
            || rootCall < 0
            || persistenceStartCall <= rootCall) {
            throw new GradleException('GP Manager Filepath compatibility check failed: startup root/migration ordering is not retained.')
        }

        def productionJava = fileTree('src/main/java') { include '**/*.java' }.files
        def rootCallers = productionJava.findAll { it.getText('UTF-8').contains('getPluginDirectory(') }
        if (rootCallers.size() != 1 || rootCallers[0].canonicalFile != pluginFile) {
            throw new GradleException('GP Manager Filepath compatibility check failed: getPluginDirectory() has an unexpected production owner.')
        }

        if (!(repositorySource.contains('import net.runelite.client.util.Filepath;')
                || repositorySource.contains('import net.runelite.client.util.*;'))
            || !repositorySource.contains('initialize(Filepath pluginDirectory)')
            || !repositorySource.contains('Filepath rooted = pluginDirectory.rooted()')) {
            throw new GradleException('GP Manager Filepath compatibility check failed: SessionRepository does not consume the supplied bounded root.')
        }

        ['migrateLegacyDirectory', 'copyDirectory', 'firstExistingLegacyDirectory',
            'LEGACY_DATA_DIRECTORIES', 'smart-profit-tracker'].each { marker ->
            if (repositorySource.contains(marker)) {
                throw new GradleException("GP Manager Filepath compatibility check failed: retired manual legacy copier remains (${marker}).")
            }
        }

        def uncheckedProduction = productionJava.findAll { it.getText('UTF-8').contains('Filepath.Unchecked') }
        if (!uncheckedProduction.isEmpty()) {
            throw new GradleException('GP Manager Filepath compatibility check failed: production Filepath.Unchecked remains.')
        }

        // 1.0 ships a fresh schema 108 with no upgrade path: nothing older is read or imported.
        if (!savedStateSource.contains('CURRENT_SCHEMA_VERSION = 108')
            || savedStateSource.contains('MIN_SUPPORTED_SCHEMA_VERSION')
            || file('src/main/java/com/gpmanager/engine/LegacyImport.java').exists()
            || file('src/main/java/com/gpmanager/persistence/LegacyAccountingPolicyV1.java').exists()) {
            throw new GradleException('GP Manager migration check failed: pre-release import code must stay retired.')
        }

        if (!file('icon.png').isFile()
            || !file('src/main/resources/profit_manager_icon.png').isFile()) {
            throw new GradleException('GP Manager identity check failed: current public/runtime icon resources are missing.')
        }

        if (file('src/main/java/com/smartprofittracker').exists()
            || file('src/test/java/com/smartprofittracker').exists()
            || file('src/simulation/java/com/smartprofittracker').exists()) {
            throw new GradleException('GP Manager compatibility check failed: an obsolete Smart Profit Tracker package tree remains.')
        }

        if (file('src/main/java/com/profitmanager').exists()
            || file('src/test/java/com/profitmanager').exists()
            || file('src/simulation/java/com/profitmanager').exists()) {
            throw new GradleException('GP Manager compatibility check failed: an obsolete com.profitmanager package tree remains.')
        }

        println 'Branding compatibility audit passed: current public identity, config bridges, RuneLite Filepath ownership, and supported migration coverage.'
    }
}
